<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Làm Đề Thi - Ôn Thi ĐGNL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui'] },
                    colors: { brand: { 50: '#fef2f2', 100: '#fee2e2', 500: '#ef4444', 600: '#dc2626', 700: '#b91c1c' } }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">

    <header class="sticky top-0 z-50 bg-white/90 backdrop-blur border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <a href="index.html" class="flex items-center gap-2 font-black text-xl text-brand-700">
                    <span class="inline-flex w-8 h-8 items-center justify-center rounded-lg bg-brand-600 text-white">
                        <svg viewBox="0 0 24 24" class="w-5 h-5" fill="currentColor"><path d="M12 2l9 6-9 6-9-6 9-6zm0 8.5l9 5.5-9 6-9-5.5 9-5.5z"/></svg>
                    </span>
                    Ôn Thi ĐGNL
                </a>
                <nav class="hidden md:flex items-center gap-1 text-sm font-medium">
                    <a href="kho-de-thi.html" class="px-3 py-2 rounded-lg text-slate-600 hover:text-brand-600 hover:bg-brand-50 transition">Kho đề thi</a>
                </nav>
            </div>
            <button id="backBtn" type="button" class="px-4 py-2 rounded-lg text-sm font-bold text-white bg-brand-600 hover:bg-brand-700 shadow-sm transition">← Quay lại</button>
        </div>
    </header>

    <main class="pt-20 pb-12 px-4">
        <div class="max-w-4xl mx-auto space-y-6">
            <section id="examSection" class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
                <div id="questionContainer" class="space-y-4">
                    <p class="text-slate-500">Đang tải danh sách câu hỏi từ cơ sở dữ liệu...</p>
                </div>

                <div class="mt-6 flex items-center gap-3">
                    <button id="submitExamBtn" type="button" class="px-5 py-3 rounded-xl text-white font-bold bg-brand-600 hover:bg-brand-700 shadow-md transition">Nộp bài</button>
                    <span id="submitMsg" class="text-sm text-slate-500"></span>
                </div>

                <div id="resultBox" class="hidden mt-6 bg-slate-50 rounded-2xl p-5 border border-slate-100">
                    <h3 class="text-lg font-black mb-2">Kết quả</h3>
                    <p id="resultSummary" class="text-slate-700 font-semibold"></p>
                    <div id="resultDetails" class="mt-3 space-y-2"></div>
                </div>
            </section>
        </div>
    </main>

    <script>
        if (!localStorage.getItem('user')) { window.location.href = 'login.html'; }
        const API_BASE_URL = "http://localhost:8000/api";

        const userStr = localStorage.getItem('user');
        let currentUser = null;
        try { currentUser = JSON.parse(userStr); } catch (e) { currentUser = null; }
        // không còn greeting "Xin chào ..." trên giao diện

        let allQuestions = [];

        function escapeHtml(text) {
            return String(text).replace(/[&<>"']/g, function (ch) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
            });
        }

        async function fetchQuestions() {
            const res = await fetch(`${API_BASE_URL}/Questions`);
            if (!res.ok) throw new Error("Không thể tải câu hỏi từ cơ sở dữ liệu.");
            return await res.json();
        }

        function renderQuestions(questions) {
            const container = document.getElementById('questionContainer');
            if (!questions.length) {
                container.innerHTML = '<p class="text-slate-500">Chưa có câu hỏi trong hệ thống.</p>';
                return;
            }
            container.innerHTML = questions.map((q, index) => `
                <div class="rounded-2xl border border-slate-100 bg-slate-50 p-5">
                    <p class="font-bold text-slate-800 mb-3">Câu ${index + 1}: ${escapeHtml(q.Content || '')}</p>
                    <div class="space-y-2">
                        ${['A','B','C','D'].map(key => `
                            <label class="flex items-center gap-3 p-3 rounded-xl bg-white border border-slate-200 hover:border-brand-300 cursor-pointer transition">
                                <input type="radio" name="q_${q.Id}" value="${key}" class="accent-brand-600">
                                <span class="font-medium text-slate-700">${key}. ${escapeHtml(q['Option' + key] || '')}</span>
                            </label>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('submitExamBtn').addEventListener('click', async () => {
            const btn = document.getElementById('submitExamBtn');
            const msg = document.getElementById('submitMsg');
            if (!allQuestions.length) {
                msg.textContent = "Chưa có câu hỏi để nộp.";
                msg.className = "text-sm text-red-600 font-medium";
                return;
            }

            const answers = allQuestions.map(q => {
                const selected = document.querySelector(`input[name="q_${q.Id}"]:checked`);
                return {
                    questionId: q.Id,
                    selectedAnswer: selected ? selected.value : ""
                };
            });

            msg.textContent = "Đang chấm bài...";
            msg.className = "text-sm text-brand-600 font-medium";
            btn.disabled = true;

            try {
                const res = await fetch(`${API_BASE_URL}/Exam/submit`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ answers: answers })
                });
                if (!res.ok) {
                    const errText = await res.text();
                    throw new Error(errText || "Không thể chấm bài.");
                }
                const data = await res.json();
                msg.textContent = "Đã nộp bài thành công.";
                msg.className = "text-sm text-emerald-600 font-medium";

                const resultBox = document.getElementById('resultBox');
                const summary = document.getElementById('resultSummary');
                const details = document.getElementById('resultDetails');
                resultBox.classList.remove('hidden');
                summary.textContent = `Kết quả: ${data.CorrectCount}/${data.TotalQuestions} câu đúng — ${data.ScorePercentage}%`;

                details.innerHTML = (data.Details || []).map((d, index) => `
                    <div class="rounded-xl border ${d.isCorrect ? 'border-emerald-200 bg-emerald-50' : 'border-red-200 bg-red-50'} p-4">
                        <div class="flex items-center justify-between mb-2">
                            <span class="font-bold text-slate-800">Câu ${index + 1}</span>
                            <span class="text-xs font-bold ${d.isCorrect ? 'text-emerald-600' : 'text-red-600'}">${d.isCorrect ? 'Đúng' : 'Sai'}</span>
                        </div>
                        <p class="text-sm text-slate-700 mb-2">${escapeHtml(d.content || '')}</p>
                        <p class="text-xs text-slate-600">Bạn chọn: <span class="font-bold">${d.selectedAnswer || 'Chưa chọn'}</span> • Đáp án đúng: <span class="font-bold">${d.correctAnswer}</span></p>
                        <p class="text-xs text-slate-500 mt-1">${escapeHtml(d.explanation || '')}</p>
                    </div>
                `).join('');
            } catch (err) {
                msg.textContent = err.message || "Nộp bài thất bại.";
                msg.className = "text-sm text-red-600 font-medium";
            } finally {
                btn.disabled = false;
            }
        });

        document.getElementById('backBtn').addEventListener('click', () => {
            localStorage.removeItem('user');
            window.location.href = 'index.html';
        });

        const selectedSubject = new URLSearchParams(window.location.search).get('subject');
        const selectedExamCode = new URLSearchParams(window.location.search).get('examCode');

        async function init() {
            try {
                const questions = await fetchQuestions();
                let filtered = selectedSubject
                    ? questions.filter(q => (q.SubjectCategory || '').toLowerCase() === selectedSubject.toLowerCase())
                    : questions;
                if (selectedExamCode) {
                    filtered = filtered.filter(q => (q.ExamCode || '').trim().toLowerCase() === selectedExamCode.trim().toLowerCase());
                }
                if (!filtered.length) {
                    document.getElementById('questionContainer').innerHTML = '<p class="text-red-600 text-sm">Không tìm thấy câu hỏi phù hợp với bộ đề đã chọn.</p>';
                    return;
                }
                allQuestions = filtered;
                renderQuestions(filtered);

            } catch (err) {
                document.getElementById('questionContainer').innerHTML = `<p class="text-red-600 text-sm">${escapeHtml(err.message)}</p>`;
            }
        }

        init();
    </script>
</body>
</html>
