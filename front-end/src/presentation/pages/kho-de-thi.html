<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kho Đề Thi - Ôn Thi ĐGNL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui'] },
                    colors: { brand: { 50: '#fef2f2', 100: '#fee2e2', 500: '#ef4444', 600: '#dc2626', 700: '#b91c1c' } }
                }
            }
        }
    </script>
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">

    <header class="sticky top-0 z-50 bg-white/90 backdrop-blur border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <a href="index.html" class="flex items-center gap-2 font-black text-xl text-brand-700">
                    <span class="inline-flex w-8 h-8 items-center justify-center rounded-lg bg-brand-600 text-white">
                        <svg viewBox="0 0 24 24" class="w-5 h-5" fill="currentColor"><path d="M12 2l9 6-9 6-9-6 9-6zm0 8.5l9 5.5-9 6-9-5.5 9-5.5z"/></svg>
                    </span>
                    Ôn Thi ĐGNL
                </a>
                <nav class="hidden md:flex items-center gap-1 text-sm font-medium">
                    <a href="kho-de-thi.html" class="px-3 py-2 rounded-lg bg-brand-50 text-brand-600 font-semibold transition">Kho đề thi</a>
                </nav>
            </div>
            <button id="backBtn" type="button" class="px-4 py-2 rounded-lg text-sm font-bold text-white bg-brand-600 hover:bg-brand-700 shadow-sm transition">← Quay lại</button>
        </div>
    </header>

    <main class="pt-20 pb-12 px-4">
        <div class="max-w-6xl mx-auto space-y-6">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
                <h1 class="text-2xl font-black">Kho đề thi</h1>
                <p class="text-slate-500 text-sm mt-1">Chọn môn để lọc đề thi. Bấm vào bộ đề để bắt đầu làm bài.</p>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-4">
                <div id="subjectFilters" class="flex flex-wrap gap-2"></div>
            </div>

            <section id="setList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                <p class="text-slate-500 text-sm">Đang tải danh sách bộ đề...</p>
            </section>
        </div>
    </main>

    <script>
        if (!localStorage.getItem('user')) { window.location.href = 'login.html'; }
        const API_BASE_URL = "http://localhost:8000/api";

        let allQuestions = [];
        let activeSubject = 'all';

        function escapeHtml(text) {
            return String(text).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
        }

        function subjectOf(q) {
            return (q.SubjectCategory || '').trim() || 'Chung';
        }

        function buildSubjects() {
            return ['Tất cả', 'Toán', 'Ngữ văn', 'Tiếng Anh', 'Vật lý', 'Hóa học', 'Địa lý', 'Lịch sử'];
        }

        function filteredQuestions() {
            if (activeSubject === 'all' || activeSubject === 'Tất cả') return allQuestions;
            return allQuestions.filter(q => subjectOf(q) === activeSubject);
        }

        function renderFilters() {
            const container = document.getElementById('subjectFilters');
            const subjects = buildSubjects();
            container.innerHTML = subjects.map(s => {
                const active = s === activeSubject;
                return `<button type="button" data-subject="${escapeHtml(s)}" class="subject-btn px-4 py-2 rounded-full text-sm font-bold transition ${active ? 'bg-brand-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-brand-50 hover:text-brand-600'}">${escapeHtml(s)}</button>`;
            }).join('');

            container.querySelectorAll('.subject-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    activeSubject = btn.getAttribute('data-subject');
                    renderFilters();
                    renderSetList();
                });
            });
        }

        function renderSetList() {
            const container = document.getElementById('setList');
            const qs = filteredQuestions();
            const groups = new Map();
            for (const q of qs) {
                const code = (q.ExamCode || '').trim() || 'Bộ đề chung';
                if (!groups.has(code)) groups.set(code, []);
                groups.get(code).push(q);
            }

            if (!groups.size) {
                container.innerHTML = `
                    <div class="rounded-2xl border border-slate-100 bg-white p-5 shadow-sm">
                        <p class="text-slate-500 text-sm">Chưa có dữ liệu.</p>
                    </div>
                `;
                return;
            }

            const subjectParam = (activeSubject !== 'all' && activeSubject !== 'Tất cả')
                ? '?subject=' + encodeURIComponent(activeSubject)
                : '';

            container.innerHTML = [...groups.entries()].map(([code, items]) => {
                const isCommon = code === 'Bộ đề chung';
                const count = items.length;
                const examParam = isCommon ? '' : '&examCode=' + encodeURIComponent(code);
                const href = 'exam.html' + (subjectParam ? subjectParam + examParam : (examParam ? '?' + examParam.substring(1) : ''));
                const title = isCommon
                    ? (activeSubject === 'all' || activeSubject === 'Tất cả' ? 'Bộ đề tổng hợp ĐGNL' : 'Bộ đề ' + activeSubject)
                    : 'Bộ đề: ' + code;
                const subtitle = isCommon
                    ? 'Gồm ' + count + ' câu hỏi thuộc môn ' + (activeSubject === 'all' || activeSubject === 'Tất cả' ? 'Tất cả các môn' : activeSubject) + '.'
                    : 'Mã đề: ' + code + ' - Gồm ' + count + ' câu hỏi.';
                return `
                    <div class="rounded-2xl border border-slate-100 bg-white p-5 shadow-sm hover:shadow-md transition">
                        <div class="flex items-center justify-between mb-3">
                            <span class="px-3 py-1 rounded-full text-xs font-bold ${count > 0 ? 'bg-emerald-50 text-emerald-600' : 'bg-slate-200 text-slate-500'}">${count > 0 ? 'Sẵn sàng' : 'Chưa có dữ liệu'}</span>
                            <span class="text-2xl">📘</span>
                        </div>
                        <h3 class="font-bold text-lg text-slate-800 mb-1">${title}</h3>
                        <p class="text-sm text-slate-500 mb-4">${subtitle}</p>
                        <a href="${href}" class="block text-center w-full py-2.5 rounded-xl text-white font-bold ${count > 0 ? 'bg-brand-600 hover:bg-brand-700 shadow-sm' : 'bg-slate-300 pointer-events-none'} transition">
                            Làm bài ngay
                        </a>
                    </div>
                `;
            }).join('');
        }


        async function init() {
            try {
                const res = await fetch(`${API_BASE_URL}/Questions`);
                if (!res.ok) throw new Error("Không thể tải danh sách đề thi.");
                allQuestions = await res.json();
                activeSubject = 'Tất cả';
                renderFilters();
                renderSetList();
            } catch (err) {
                document.getElementById('setList').innerHTML = `<p class="text-red-600 text-sm">${escapeHtml(err.message)}</p>`;
            }
        }

        document.getElementById('backBtn').addEventListener('click', () => {
            window.location.href = 'index.html';
        });

        init();
    </script>
</body>
</html>
